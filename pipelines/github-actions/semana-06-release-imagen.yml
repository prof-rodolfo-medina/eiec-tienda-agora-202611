# SEMANA 6 · Temas 8 y 9 · Artefacto único y registro de contenedores
# Copia este archivo a .github/workflows/release.yml en tu fork.
#
# Idea central (Tema 4, "compilación única"): la imagen se construye UNA vez por
# commit, se etiqueta con el SHA y, si es una versión, con su número semántico.
# A partir de aquí, staging y producción despliegan esa misma imagen.
#
# Registro: GitHub Container Registry (ghcr.io), gratuito para repos públicos.
# No necesita secretos: usa el GITHUB_TOKEN del propio run.
name: Release - imagen de contenedor

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Calcular versión de la app
        id: appversion
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-sha.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar (una sola vez)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.appversion.outputs.value }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Manifiesto de la versión (trazabilidad commit -> artefacto)
        run: |
          mkdir -p release
          cat > release/release-manifest.json <<EOF
          {
            "app_version": "${{ steps.appversion.outputs.value }}",
            "commit": "${{ github.sha }}",
            "image": "ghcr.io/${{ github.repository }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "tags": "$(echo '${{ steps.meta.outputs.tags }}' | tr '\n' ' ')",
            "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          EOF
          cat release/release-manifest.json

      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ github.sha }}
          path: release/release-manifest.json

  smoke-image:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Arrancar la imagen recién publicada y verificarla
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}@${{ needs.build-and-push.outputs.digest }}"
          docker run -d --name agora -p 8000:8000 -e APP_ENV=ci "$IMAGE"
          BASE_URL=http://localhost:8000 bash scripts/smoke_test.sh
          docker logs agora
