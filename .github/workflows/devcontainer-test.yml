# TEMPORAL: verifica que el devcontainer se construye. Se elimina antes de fusionar.
name: Prueba temporal del devcontainer
on:
  push:
    branches: [fix/devcontainer-yarn]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construir y arrancar el devcontainer (con features y postCreate)
        run: |
          npx -y @devcontainers/cli@latest up --workspace-folder .
      - name: Probar dentro del contenedor
        run: |
          npx -y @devcontainers/cli@latest exec --workspace-folder . bash -lc "python --version && docker --version && make lint test"
