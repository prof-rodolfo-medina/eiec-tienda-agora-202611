[pytest]
testpaths = tests
pythonpath = .
# Por defecto se ejecutan unit + api. Los smoke tests requieren un entorno desplegado:
#   python -m pytest -m smoke
addopts = -ra -m "not smoke"
markers =
    unit: pruebas unitarias, rápidas y sin dependencias externas
    api: pruebas de contrato HTTP con TestClient
    smoke: verificación rápida de un entorno desplegado (requiere BASE_URL)
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated
